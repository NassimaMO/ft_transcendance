{% load static %}

{% block extraCSS %}
	<link rel="stylesheet" type="text/css" href="{% static 'css/dashboard.css' %}">
{% endblock %}

{% block content %}
<div class="dashboard-container">
    <div class="user-info">
        <h2 class="username">Sheil</h2>
        <div class="rank-bar">
            <div class="rank">Gold IV</div>
            <div class="rank-level"></div>
        </div>
    </div>
    <div class="statistics">
        <div class="stats-display">
            <h6 class="stat-name">Games played</h6>
            <div class="stat-number">10</div>
        </div>
        <div class="stats-display">
            <h6 class="stat-name">Games won</h6>
            <div class="stat-number">4</div>

        </div>
        <div class="stats-display">
            <h6 class="stat-name">Games lost</h6>
            <div class="stat-number">6</div>
        </div>
        <div class="stats-display">
            <h6 class="stat-name">Max paddle combo</h6>
            <div class="stat-number">10</div>
        </div>
    </div>
    <div class="metrics">
        <div class="bar">
            <div class="bar-level" style="height: 70%;"></div>
            <div class="bar-name">Average score</div>
        </div>
        <div class="bar">
            <div class="bar-level" style="height: 50%;"></div>
            <div class="bar-name">Win streak</div>
        </div>
        <div class="bar">
            <div class="bar-level" style="height: 30%;"></div>
            <div class="bar-name">Win Loss Ratio</div>
        </div>
    </div>
</div>
{% endblock %}
