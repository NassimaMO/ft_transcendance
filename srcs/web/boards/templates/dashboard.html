{% load static %}

{% block extraCSS %}
	<link rel="stylesheet" type="text/css" href="{% static 'css/dashboard.css' %}">
{% endblock %}

{% block content %}
<div class="dashboard-container">
    <div class="user-info">
        <h2 class="username">{{ user.username }}</h2>
        <div class="rank-bar">
            <div class="rank">Gold IV</div>
            <div class="rank-level"></div>
        </div>
    </div>
    <div class="statistics">
        <div class="stats-display">
            <h6 class="stat-name">Games played</h6>
            <div class="stat-number">{{ total_games_played }}</div>
        </div>
        <div class="stats-display">
            <h6 class="stat-name">Games won</h6>
            <div class="stat-number">{{ games_won }}</div>

        </div>
        <div class="stats-display">
            <h6 class="stat-name">Games lost</h6>
            <div class="stat-number">6</div>
        </div>
        <div class="stats-display">
            <h6 class="stat-name">Max paddle combo</h6>
            <div class="stat-number">10</div>
        </div>
    </div>
    <div class="streak">🔥 {{ win_streak }} Wins</div>
    <div class="charts">
        <div class="chart-one">
            <div class="pie-chart">
                <div class="slice-win"></div>
                <div class="slice-lost"></div>
            </div>
            <div>Win Loss Ratio</div>
        </div>
        <div class="chart-two">
            <div class="bar-level" style="height: 70%;"></div>
            <div>Average score</div>
        </div>
    </div>
</div>
{% endblock %}
