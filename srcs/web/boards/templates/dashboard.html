{% load static %}

{% block extraCSS %}
	<link rel="stylesheet" type="text/css" href="{% static 'css/dashboard.css' %}">
{% endblock %}

{% block content %}
<div class="dashboard-container">
    <div class="level-info">
        <h2 class="rank">Gold</h2>
        <div class="level">3.18 lvl</div>
        <div class="rank-bar">
            <div class="number-level">112/300</div>
            <div class="rank-level"></div>
        </div>
    </div>
    <div class="statistics">
        <div class="stats-display">
            <h6 class="stat-name">Games played</h6>
            <div class="stat-number">10</div>
        </div>
        <div class="stats-display">
            <h6 class="stat-name">Games won</h6>
            <div class="stat-number">4</div>

        </div>
        <div class="stats-display">
            <h6 class="stat-name">Games lost</h6>
            <div class="stat-number">6</div>
        </div>
        <div class="stats-display">
            <h6 class="stat-name">Max paddle combo</h6>
            <div class="stat-number">10</div>
        </div>
    </div>
    <div class="metrics">
        <div class="bar" style="height: 70%;"></div>
        <div class="bar" style="height: 50%;"></div>
        <div class="bar" style="height: 30%;"></div>
        <!--
        - Average score
        - Win streak
        - Win Loss Ratio
        -->
    </div>
</div>
{% endblock %}
