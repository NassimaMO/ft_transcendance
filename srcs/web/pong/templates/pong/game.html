{% extends "base.html" %}
{% load static %}

{% block content %}
	<h1>Pong</h1>
	<style>
		canvas {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-size: 0;
      }
	</style>
	<canvas id="renderCanvas"></canvas>
{% endblock %}

{% block extraJS %}
	<script type="importmap">
		{
			"imports": {
				"@babylonjs/core/": "https://cdn.jsdelivr.net/npm/@babylonjs/core@8.16.1/",
				"three": "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/"
			}
		}
	</script>
	<script type="module" defer src="{% static 'pong/jsBabylon/main.js' %}"></script>
{% endblock %}
